<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D 八千代辉夜姬</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#000;
    }
    #canvas-container {
      width:100vw; height:100vh;
      display:block;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 只加载必要的库 -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="libs/live2dcubismcore.js"></script>
  <script src="libs/live2d.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>

  <script>
    (function() {
      'use strict';

      // ---------- 配置 ----------
      const MODEL_URL = 'https://cdn.jsdelivr.net/gh/mougou666/yachiyo-live2d/八千代辉夜姬.model3.json';
      const BG_IMAGE = 'a.jpg';   // 背景图片，与 index.html 同目录
      
      // 自适应基准：当窗口高度为 730px 时，缩放为 0.2
      const BASE_HEIGHT = 730;
      const BASE_ZOOM = 0.2;
      
      // 位置因子：Y = 窗口高度 * 1.2（偏下）
      const POSITION_Y_FACTOR = 1.2;

      // ---------- 创建 Pixi 应用 ----------
      const app = new PIXI.Application({
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: 0x000000,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });
      document.getElementById('canvas-container').appendChild(app.view);

      // ---------- 自适应函数 ----------
      function updateSizeAndPosition() {
        const w = app.renderer.width;
        const h = app.renderer.height;

        // 1. 背景图片铺满
        if (window._bgSprite) {
          window._bgSprite.width = w;
          window._bgSprite.height = h;
        }

        // 2. 模型缩放：根据高度线性变化
        if (window._model) {
          // 计算当前缩放 = 基准缩放 * (当前高度 / 基准高度)
          const zoom = BASE_ZOOM * (h / BASE_HEIGHT);
          window._model.scale.set(zoom, zoom);
          
          // 位置：水平居中，垂直在 h * POSITION_Y_FACTOR 处
          window._model.x = w / 2;
          window._model.y = h * POSITION_Y_FACTOR;
          window._model.anchor.set(0.5, 0.5);
        }
      }

      // 监听窗口变化
      window.addEventListener('resize', () => {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        updateSizeAndPosition();
      });

      // ---------- 添加背景图片 ----------
      const bgTexture = PIXI.Texture.from(BG_IMAGE);
      const bgSprite = new PIXI.Sprite(bgTexture);
      bgSprite.width = app.renderer.width;
      bgSprite.height = app.renderer.height;
      app.stage.addChild(bgSprite);
      window._bgSprite = bgSprite;

      // ---------- 加载提示 ----------
      const loadingStyle = new PIXI.TextStyle({ fill: '#ffffff', fontSize: 24, fontWeight: 'bold' });
      const loadingText = new PIXI.Text('加载模型中...', loadingStyle);
      loadingText.x = app.renderer.width / 2;
      loadingText.y = app.renderer.height - 60;
      loadingText.anchor.set(0.5);
      app.stage.addChild(loadingText);

      // ---------- 加载模型（只加载一次） ----------
      PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: true })
        .then(model => {
          window._model = model;
          // 添加到舞台（背景之上）
          app.stage.addChild(model);
          
          // 调用一次自适应设置大小和位置
          updateSizeAndPosition();
          
          // 移除加载提示
          app.stage.removeChild(loadingText);
          console.log('✅ 模型加载成功，自适应已启用');
        })
        .catch(err => {
          console.error('❌ 模型加载失败:', err);
          loadingText.text = '加载失败，请刷新重试';
          loadingText.style.fill = '#ff6666';
        });

      // 超时提示
      setTimeout(() => {
        if (!window._model) {
          loadingText.text = '加载超时，请检查网络或刷新';
          loadingText.style.fill = '#ffaa00';
        }
      }, 15000);

    })();
  </script>
</body>
</html>
